<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spruch des Tages</title>
    <style>
        body {
            background: linear-gradient(135deg, #FFC0CB, #D291BC);
            color: #FEFCFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 70px;
            border-radius: 0px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            height:  90vh;
            max-width: 450px;
            width: 100%;
        }

        /* CSS */
        .eule-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            height: 110px;
        }
        #welcome-text {
            position: absolute;
            z-index: 1; /* Liegt hinter der Eule */
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            user-select: none;
            display: none; /* Standardmäßig unsichtbar */
            transition: opacity 1.5s ease; /* Sanftes Ausblenden */
        }
        .eule-gif {
            position: relative;
            z-index: 2; /* Liegt vor dem Welcome-Text */
            width: 100px;
            height: auto;
        }
        
        #datetime {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
            font-weight: 600;
        }
        .trennlinie {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            margin: 20px auto;
            width: 80%;
        }
      
        #quote {
            font-style: italic;
            font-size: 1.25rem;
            line-height: 1.6;
            margin: 0;
            opacity: 0.9;
        }
       /* Navigation CSS */
        }
      .tabs li {
        flex: 1
      }
      .tabs a {
        display: block;
        font-weight: bold;
        color: var(--accent1-color); 
        font-variant:normal;
        text-decoration:None;
      }
      [aria-current="page"]{
     background: var(--accent2-color);
} 
  nav a:focus,
  nav a:hover,
  nav a:active {    
    text-decoration:underline;
  }
:root {
	--background-color: #FFE4E1;
	--accent1-color: #F08080;
	--accent2-color: #FAF0E6;	
	--text-color: black;
}
      nav a {
      display: block;
      padding: 1em;
      text-decoration: none; 
      font-weight: bold;
      font-size: 0.4rem
      border: thin solid var(--background-color);
      border-radius: none;
    color: var(--accent1-color); 
    background-color: var(--background-color);
      transition: all .25s ease-in;	  
    }

  nav a[aria-current] {
	background-color: var(--accent2-color); 
  }
	
    nav a:focus,
    nav a:hover,
    nav a[aria-current]:focus,
    nav a[aria-current]:hover {    
      color: var(--background-color); 
      background-color: var(--accent1-color); 
    }
      nav a {
        text-align: center;
    }
    nav li {
      display: inline-block;
}
    </style>
</head>
<body>

  
<div class="container">
  <!-- DEINE NAVIGATION -->
    <nav class="tabs">
        <ul>
            <li><a href="index.html" class="seite-1" aria-current="page">Home</a></li>
            <li><a href="seite_2.html" class="seite-2">Mini Games</a></li>
        </ul>
    </nav>
    <div class="eule-wrapper">
        <span id="welcome-text">Welcome</span>
        <img class="eule-gif" src="https://i.pinimg.com/originals/96/e6/12/96e612ebf5056c7bcb416a25cfc96938.gif" alt="Fliegende Pixel-Eule">

     
    </div>

    <h2 id="datetime">Lade Datum...</h2>
    <hr class="trennlinie">
    <p id="quote">Lade Spruch des Tages...</p>
</div>
 

<script>
    // =========================================
    // NEU AB HIER: Prüfung auf ersten Besuch
    // =========================================
    if (!localStorage.getItem('schonBesucht')) {
        const welcomeEl = document.getElementById('welcome-text');
        welcomeEl.style.display = 'block';
        localStorage.setItem('schonBesucht', 'true');

        // Blendet "Welcome" nach 4 Sekunden sanft aus
        setTimeout(() => {
            welcomeEl.style.opacity = '0';
        }, 4000);
    }
    // =========================================
    // ENDE NEU (JavaScript)
    // =========================================

    function updateDateTime() {
        const jetzt = new Date();
        const optionen = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const datumString = jetzt.toLocaleDateString('de-DE', optionen);
        const zeitString = jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        
        document.getElementById('datetime').innerHTML = datumString + "<br><span style='font-size: 1.2rem; opacity: 0.7; font-weight: 300;'>" + zeitString + " Uhr</span>";
    }

    const sprueche = [
        "Zeit zum Entspannen und Kraft tanken für die neue Woche! ☕",
        "Neuer Tag, neue Chancen. Lass uns durchstarten! 💪",
        "Der zweite Schritt ist getan. Du bist auf dem richtigen Weg! ✨",
        "Die Hälfte ist geschafft! Bergfest! 🎉",
        "Das Wochenende ist schon in Sicht, bleib dran! 🚀",
        "Fast geschafft! Hab einen großartigen Start ins Wochenende! 🥂",
        "Genieße deinen Tag und mach das, was dich glücklich macht! ☀️"
    ];

    const wochentag = new Date().getDay();
    document.getElementById('quote').innerText = sprueche[wochentag];

    updateDateTime();
    setInterval(updateDateTime, 1000);
</script>

</body>
</html>
