<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mittwoch - Zahlenraten</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <nav class="tabs">
        <ul>
            <li><a href="seite_2.html">⬅️ Zurück zu Mini Games</a></li>
        </ul>
    </nav>
   <div class="game-box">
    <h3>3. Mittwoch: Zahlen-Wordle (1–100) 🔢</h3>
    <details class="anleitung-box">
    <summary>Ria erklätz! Ja Kostenlose !!!</summary>
    <p> Einbisschen Mathe muss sein. Löse 3 Mathe Aufgaben. Die sind Aufgaben sind nicht so schwer...so dont come for me</p>
</details>
    <!-- 5 Kästchen-Zeilen für die 5 Versuche -->
    <div id="mi-board" class="mi-board"></div>

    <!-- Eingabefeld & Button -->
    <div id="mi-area" style="margin-top: 15px; display: flex; justify-content: center; gap: 8px;">
        <input type="number" id="mi-input" class="game-input" min="1" max="100" placeholder="1-100" style="margin: 0; width: 100px;">
        <button class="game-btn" id="mi-btn" style="margin: 0;">Raten</button>
    </div>

    <div class="game-status" id="mi-status">Du hast noch 5 Versuche! 🦉</div>
</div>
    
<script src="script.js"></script>
</body>
</html>
