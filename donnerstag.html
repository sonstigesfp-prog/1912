<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donnerstag - Reaktions-Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <nav class="tabs">
        <ul>
            <li><a href="seite_2.html">⬅️ Zurück zu Mini Games</a></li>
        </ul>
    </nav>
    <div class="game-box">
        <h3>Rias Wissenestest-</h3>
     <details class="anleitung-box">
        <summary>Ria erklärt. Ja Kostenlose!</summary>
        <p> Lass uns dein Wissen Test. Beantworte die folgen fragen richtig!- </p>
      </details>   
        <div id="do-area">
            <p id="do-frage" style="font-size: 1.1rem; font-weight: bold; min-height: 55px; margin-bottom: 15px;">Lade Frage...</p>
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button class="game-btn" id="do-wahr" style="flex: 1;">✅ Wahr</button>
                <button class="game-btn" id="do-falsch" style="flex: 1;">❌ Falsch</button>
            </div>
        </div>

        <div class="game-status" id="do-status">Fortschritt: 0 / 3 richtig</div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
